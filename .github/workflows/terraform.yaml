name: terraform

concurrency:
  group: terraform-prod
  cancel-in-progress: true

on: workflow_dispatch

env:
  TF_VERSION: 1.15

permissions:
  id-token: write
  contents: read

jobs:

  terraform-plan:
    environment: preprod
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: ${{ vars.TF_ROLE_ARN_READONLY }}
        role-session-name: samplerolesession  
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}

    - name: Terraform Init
      id: init
      run: terraform init -input=false

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false --out=tf_output.tfplan
    
    - name: Upload file
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: tf_output.tfplan
  
  terraform-apply:
    runs-on: ubuntu-latest
    environment: prod
    needs: terraform-plan
    steps:

    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: ${{ vars.TF_ROLE_ARN_ADMIN }}
        role-session-name: samplerolesession
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}

    - name: Download file
      uses: actions/download-artifact@v4
      with:
        name: tfplan

    - name: Terraform Init
      id: init
      run: terraform init -input=false

    - name: Terraform Apply
      id: apply
      run: terraform apply -no-color tf_output.tfplan