apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/value-files/prometheus/values.yaml
    - repoURL: git@github.com:kramarov666/miracle6-k8s.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:kramarov666/miracle6-k8s.git
      targetRevision: HEAD
      ref: alertmanager-manifests
      path: alertmanager
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
